<style>
/* Tournament Pro - 管理画面スタイル */

/* ログイン画面 */
.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
}

.login-container {
  background: white;
  padding: 3rem;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  text-align: center;
  max-width: 400px;
  width: 90%;
}

.login-icon {
  font-size: 4rem;
  margin-bottom: 1rem;
}

.login-container h1 {
  font-size: 2rem;
  margin-bottom: 0.5rem;
  color: var(--color-text);
}

.login-container h2 {
  font-size: 1.5rem;
  margin-bottom: 1rem;
  color: var(--color-text);
}

.login-description {
  color: var(--color-text-light);
  margin-bottom: 2rem;
}

.login-footer {
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--color-border);
}

.login-footer p {
  color: var(--color-text-light);
  margin-bottom: 0.5rem;
}

/* 管理画面ヘッダー */
.admin-header {
  background: white;
  box-shadow: var(--shadow);
  padding: 1rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.header-logo {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--color-primary);
}

.header-subtitle {
  color: var(--color-text-light);
  font-size: 0.9rem;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.user-name {
  color: var(--color-text);
  font-weight: 500;
}

/* 管理画面レイアウト */
.admin-container {
  display: flex;
  min-height: calc(100vh - 70px);
}

/* サイドバー */
.sidebar {
  width: 260px;
  background: white;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 70px;
  height: calc(100vh - 70px);
  overflow-y: auto;
}

.menu {
  list-style: none;
  padding: 1rem 0;
  flex: 1;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  color: var(--color-text);
  cursor: pointer;
  transition: var(--transition);
  border-left: 3px solid transparent;
}

.menu-item:hover {
  background: var(--color-background);
  border-left-color: var(--color-primary);
}

.menu-item.active {
  background: rgba(37, 99, 235, 0.1);
  border-left-color: var(--color-primary);
  color: var(--color-primary);
  font-weight: 600;
}

.menu-icon {
  font-size: 1.25rem;
}

.menu-label {
  font-size: 0.95rem;
}

.sidebar-footer {
  padding: 1rem;
  border-top: 1px solid var(--color-border);
}

/* メインコンテンツ */
.main-content {
  flex: 1;
  padding: 2rem;
  overflow-y: auto;
  background: var(--color-background);
}

.page-title {
  font-size: 2rem;
  margin-bottom: 1.5rem;
  color: var(--color-text);
}

/* タブコンテンツ */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* 統計カード */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  padding: 1.5rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  text-align: center;
}

.stat-label {
  font-size: 0.875rem;
  color: var(--color-text-light);
  margin-bottom: 0.5rem;
}

.stat-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--color-primary);
  font-family: 'Inter', sans-serif;
}

.stat-unit {
  font-size: 0.875rem;
  color: var(--color-text-light);
  margin-top: 0.25rem;
}

/* コート状況 */
#court-status {
  display: grid;
  gap: 1rem;
}

.court-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem;
  background: var(--color-background);
  border-radius: var(--radius);
  border-left: 4px solid transparent;
}

.court-item.occupied {
  border-left-color: var(--color-danger);
}

.court-item.preparing {
  border-left-color: var(--color-warning);
}

.court-item.available {
  border-left-color: var(--color-success);
}

.court-name {
  font-weight: 600;
  margin-right: 1rem;
}

.court-status {
  flex: 1;
  color: var(--color-text-light);
}

/* クイックアクション */
.quick-actions {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

/* カードヘッダーアクション */
.card-header-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

/* フィルターバー */
.filter-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

/* 試合カード */
.matches-container {
  display: grid;
  gap: 0.875rem;
}

.match-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 0;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--color-border);
  overflow: hidden;
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.match-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.match-card.ongoing {
  border-left-color: var(--color-danger);
}

.match-card.ongoing .match-header {
  background: #fff5f5;
}

.match-card.completed {
  border-left-color: var(--color-success);
}

.match-card.completed .match-card-body {
  opacity: 0.75;
}

/* カードヘッダー: 試合ID + ステータス + メタ情報 */
.match-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.625rem 1rem;
  background: var(--color-background);
  border-bottom: 1px solid var(--color-border);
  gap: 0.5rem;
}

.match-header-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.match-id {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--color-text);
}

.match-info {
  display: flex;
  gap: 0.75rem;
  font-size: 0.8rem;
  color: var(--color-text-light);
}

.match-status {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 0.2rem 0.6rem;
  border-radius: 50px;
  flex-shrink: 0;
}

.match-status.status-ongoing {
  background: #fee2e2;
  color: #991b1b;
}

.match-status.status-completed {
  background: #d1fae5;
  color: #065f46;
}

.match-status.status-pending {
  background: #dbeafe;
  color: #1e40af;
}

/* カードボディ: チーム名 + スコア */
.match-card-body {
  padding: 0.875rem 1rem;
}

/* チーム行（スコアボード型） */
.match-team-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 0.75rem;
  padding: 0.4rem 0;
}

.match-team-row + .match-team-row {
  border-top: 1px solid var(--color-border);
}

.match-team-row.winner-row .team-name {
  color: var(--color-primary);
  font-weight: 700;
}

.team-name {
  font-size: 1.05rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* セットスコア表示 */
.match-set-scores {
  display: flex;
  gap: 0.35rem;
  align-items: center;
}

.set-chip {
  font-size: 1rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  min-width: 2rem;
  height: 2rem;
  border-radius: var(--radius-sm);
  background: var(--color-background);
  color: var(--color-text);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-border);
}

.set-chip.win-chip {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

.set-chip.empty-chip {
  color: var(--color-text-light);
  border-style: dashed;
}

/* 総セット数バッジ */
.sets-won-badge {
  font-size: 1.3rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  min-width: 2.2rem;
  height: 2.2rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-border);
  color: var(--color-text-light);
  margin-left: 0.25rem;
}

.sets-won-badge.leading {
  background: var(--color-primary);
  color: white;
}

/* カードフッター: アクションボタン */
.match-actions {
  display: flex;
  gap: 0.5rem;
  padding: 0.625rem 1rem;
  border-top: 1px solid var(--color-border);
  background: white;
}

.match-actions .btn {
  flex: 1;
  padding: 0.5rem 0.75rem;
  font-size: 0.85rem;
  min-height: 38px;
}

/* 審判表示 */
.match-referee {
  font-size: 0.8rem;
  color: var(--color-text-light);
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* 後方互換 */
.match-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.match-vs {
  color: var(--color-text-light);
  font-size: 0.875rem;
}

.match-score {
  display: flex;
  gap: 0.5rem;
  font-size: 1.5rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--color-primary);
}

/* テーマ設定 */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.theme-option {
  border: 3px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 1.5rem;
  cursor: pointer;
  transition: var(--transition);
}

.theme-option:hover {
  border-color: var(--color-primary);
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}

.theme-option.selected {
  border-color: var(--color-primary);
  background: rgba(37, 99, 235, 0.05);
}

.theme-preview {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.theme-color {
  flex: 1;
  height: 50px;
  border-radius: var(--radius-sm);
}

.theme-name {
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.theme-description {
  font-size: 0.875rem;
  color: var(--color-text-light);
}

/* QRコード */
.qr-code-container {
  display: flex;
  justify-content: center;
  padding: 2rem;
  background: var(--color-background);
  border-radius: var(--radius-md);
  margin: 1rem 0;
}

/* フォームアクション */
.form-actions {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--color-border);
}

/* セクションサブタイトル */
.section-subtitle {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 2rem 0 1rem;
  color: var(--color-text);
  border-bottom: 2px solid var(--color-border);
  padding-bottom: 0.5rem;
}

/* ヘルプテキスト */
.help-text {
  font-size: 0.875rem;
  color: var(--color-text-light);
  margin-left: 1rem;
}

/* モーダル */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 600px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  padding: 1.5rem;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 600;
}

.modal-close {
  background: none;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--color-text-light);
}

.modal-body {
  padding: 1.5rem;
}

.modal-footer {
  padding: 1.5rem;
  border-top: 1px solid var(--color-border);
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
}

/* レスポンシブ */
@media (max-width: 1024px) {
  .admin-container {
    flex-direction: column;
  }
  
  .sidebar {
    width: 100%;
    height: auto;
    position: static;
  }
  
  .menu {
    display: flex;
    overflow-x: auto;
    padding: 0;
  }
  
  .menu-item {
    flex-direction: column;
    padding: 1rem;
    text-align: center;
    border-left: none;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
  }
  
  .menu-item.active,
  .menu-item:hover {
    border-left: none;
    border-bottom-color: var(--color-primary);
  }
}

@media (max-width: 768px) {
  .admin-header {
    padding: 1rem;
  }
  
  .header-subtitle {
    display: none;
  }
  
  .main-content {
    padding: 1rem;
  }
  
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .form-actions {
    flex-direction: column;
  }
  
  .form-actions .btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .match-card-body {
    padding: 0.75rem;
  }

  .match-teams {
    flex-direction: column;
    gap: 1rem;
  }

  .match-actions {
    flex-wrap: wrap;
  }

  .match-actions .btn {
    min-height: 44px;
    font-size: 0.875rem;
  }

  .theme-grid {
    grid-template-columns: 1fr;
  }

  /* モバイルでは試合カードのアクションを大きく */
  .set-chip {
    min-width: 1.8rem;
    height: 1.8rem;
    font-size: 0.9rem;
  }
}
</style>
