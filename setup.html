<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初期設定 - Tournament Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    /* 左下固定：トップに戻るボタン */
    .back-to-top {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      padding: 12px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .back-to-top:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .progress-bar {
      background: #e2e8f0;
      height: 8px;
      margin: 20px 0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

    .progress-step {
      text-align: center;
      flex: 1;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .progress-step.active {
      opacity: 1;
    }

    .step-number {
      width: 40px;
      height: 40px;
      background: white;
      border: 3px solid #667eea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      font-weight: bold;
      color: #667eea;
    }

    .progress-step.active .step-number {
      background: #667eea;
      color: white;
    }

    .step-label {
      font-size: 0.85em;
      color: white;
    }

    .content {
      padding: 40px;
    }

    .setup-step {
      display: none;
    }

    .setup-step.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-title {
      color: #667eea;
      margin-bottom: 25px;
      font-size: 1.8em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-label.required::after {
      content: ' *';
      color: #e53e3e;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-help {
      font-size: 0.85em;
      color: #666;
      margin-top: 5px;
    }

    .team-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .team-input-wrapper {
      position: relative;
    }

    .team-input-label {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 5px;
      display: block;
    }

    .format-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .format-option input[type="radio"] {
      display: none;
    }

    .format-card {
      border: 3px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .format-option input[type="radio"]:checked + .format-card {
      border-color: #667eea;
      background: #f7fafc;
    }

    .format-card h3 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .step-actions {
      display: flex;
      gap: 15px;
      margin-top: 30px;
      justify-content: flex-end;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #cbd5e0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #a0aec0;
    }

    .btn-large {
      padding: 15px 40px;
      font-size: 1.1em;
    }

    .complete-container {
      text-align: center;
      padding: 40px 20px;
    }

    .complete-icon {
      font-size: 5em;
      margin-bottom: 20px;
    }

    .complete-title {
      color: #667eea;
      font-size: 2em;
      margin-bottom: 15px;
    }

    .complete-description {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 30px;
    }

    .confirm-summary {
      background: #f7fafc;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
    }

    .summary-item {
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .summary-label {
      font-weight: 600;
      color: #667eea;
      margin-right: 10px;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-content {
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container {
        border-radius: 0;
      }

      body {
        padding: 0;
      }

      .content {
        padding: 20px;
      }

      .format-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- 左下固定：トップに戻る -->
  <a href="javascript:void(0);" class="back-to-top" onclick="goToTop()">← トップに戻る</a>

  <!-- ローディングオーバーレイ -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p style="font-size: 1.1em; color: #667eea; font-weight: bold;">保存中...</p>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h1>🏐 初期設定 - Tournament Pro</h1>
      <p>大会セットアップウィザード</p>
      
      <!-- プログレスバー -->
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 25%;"></div>
      </div>
      <div class="progress-steps">
        <div class="progress-step active" id="progress-1">
          <div class="step-number">1</div>
          <div class="step-label">基本情報</div>
        </div>
        <div class="progress-step" id="progress-2">
          <div class="step-number">2</div>
          <div class="step-label">チーム設定</div>
        </div>
        <div class="progress-step" id="progress-3">
          <div class="step-number">3</div>
          <div class="step-label">試合形式</div>
        </div>
        <div class="progress-step" id="progress-4">
          <div class="step-number">4</div>
          <div class="step-label">バレー設定</div>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- ステップ1: 基本情報 -->
      <div id="step-1" class="setup-step active">
        <h2 class="step-title">大会基本情報</h2>
        
        <div class="form-group">
          <label class="form-label required">大会名</label>
          <input type="text" id="tournamentName" class="form-control" placeholder="例: 春季バレーボール大会">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label required">開催日</label>
            <input type="date" id="tournamentDate" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">開始時間</label>
            <input type="time" id="startTime" class="form-control" value="13:00">
          </div>
          <div class="form-group">
            <label class="form-label">終了時間</label>
            <input type="time" id="endTime" class="form-control" value="17:00">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label required">会場名</label>
          <input type="text" id="venueName" class="form-control" placeholder="例: 市民体育館">
        </div>

        <div class="form-group">
          <label class="form-label">会場住所</label>
          <input type="text" id="venueAddress" class="form-control" placeholder="例: 東京都○○区△△1-2-3">
        </div>

        <div class="step-actions">
          <button class="btn btn-primary btn-large" onclick="goToStep(2)">次へ →</button>
        </div>
      </div>

      <!-- ステップ2: チーム設定 -->
      <div id="step-2" class="setup-step">
        <h2 class="step-title">チーム設定</h2>
        
        <div class="form-group">
          <label class="form-label required">チーム数</label>
          <select id="teamCount" class="form-control" onchange="generateTeamInputs()">
            <option value="4">4チーム</option>
            <option value="6">6チーム</option>
            <option value="8" selected>8チーム</option>
            <option value="10">10チーム</option>
            <option value="12">12チーム</option>
            <option value="16">16チーム</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label required">チーム名入力</label>
          <div id="team-inputs" class="team-inputs">
            <!-- JavaScriptで動的に生成 -->
          </div>
        </div>

        <div class="step-actions">
          <button class="btn btn-secondary btn-large" onclick="goToStep(1)">← 戻る</button>
          <button class="btn btn-primary btn-large" onclick="goToStep(3)">次へ →</button>
        </div>
      </div>

      <!-- ステップ3: 試合形式 -->
      <div id="step-3" class="setup-step">
        <h2 class="step-title">試合形式選択</h2>
        
        <div class="format-options">
          <label class="format-option">
            <input type="radio" name="matchFormat" value="league">
            <div class="format-card">
              <h3>リーグ戦のみ</h3>
              <p>全チームが総当たりで対戦</p>
            </div>
          </label>

          <label class="format-option">
            <input type="radio" name="matchFormat" value="tournament" checked>
            <div class="format-card">
              <h3>トーナメントのみ</h3>
              <p>シングルエリミネーション（推奨）</p>
            </div>
          </label>

          <label class="format-option">
            <input type="radio" name="matchFormat" value="hybrid">
            <div class="format-card">
              <h3>複合形式</h3>
              <p>予選リーグ → 決勝トーナメント</p>
            </div>
          </label>
        </div>

        <div class="step-actions">
          <button class="btn btn-secondary btn-large" onclick="goToStep(2)">← 戻る</button>
          <button class="btn btn-primary btn-large" onclick="goToStep(4)">次へ →</button>
        </div>
      </div>

      <!-- ステップ4: バレーボール設定 -->
      <div id="step-4" class="setup-step">
        <h2 class="step-title">バレーボールルール設定</h2>
        
        <div class="form-group">
          <label class="form-label">試合形式</label>
          <select id="setFormat" class="form-control">
            <option value="3set" selected>3セットマッチ（2セット先取）</option>
            <option value="2set">2セットマッチ（1セット先取）</option>
            <option value="5set">5セットマッチ（3セット先取）</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">第1・2セット勝利点数</label>
            <input type="number" id="set12Points" class="form-control" value="25" min="15" max="50">
            <p class="form-help">一般的に25点</p>
          </div>
          <div class="form-group">
            <label class="form-label">第3セット勝利点数</label>
            <input type="number" id="set3Points" class="form-control" value="15" min="10" max="30">
            <p class="form-help">一般的に15点</p>
          </div>
          <div class="form-group">
            <label class="form-label">デュース差</label>
            <input type="number" id="deuceMargin" class="form-control" value="2" min="1" max="5">
            <p class="form-help">勝利に必要な点差</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">参加資格・注意事項（任意）</label>
          <textarea id="participationNotes" class="form-control" rows="6" placeholder="例:&#10;・参加資格: 一般の方（高校生以上）&#10;・服装: 運動着、体育館シューズ着用必須&#10;・その他: 怪我は自己責任"></textarea>
        </div>

        <div class="step-actions">
          <button class="btn btn-secondary btn-large" onclick="goToStep(3)">← 戻る</button>
          <button class="btn btn-primary btn-large" onclick="showConfirm()">確認画面へ →</button>
        </div>
      </div>

      <!-- 確認画面 -->
      <div id="step-confirm" class="setup-step">
        <h2 class="step-title">設定内容の確認</h2>
        
        <div class="confirm-summary" id="confirm-summary">
          <!-- JavaScriptで動的に生成 -->
        </div>

        <div class="step-actions">
          <button class="btn btn-secondary btn-large" onclick="goToStep(4)">← 戻って修正</button>
          <button class="btn btn-primary btn-large" onclick="saveSettings()" id="saveBtn">✓ 設定を保存</button>
        </div>
      </div>

      <!-- 完了画面 -->
      <div id="step-complete" class="setup-step">
        <div class="complete-container">
          <div class="complete-icon">🎉</div>
          <h2 class="complete-title">初期設定が完了しました！</h2>
          <p class="complete-description">大会の基本設定が保存されました。<br>管理画面で詳細設定を続けましょう。</p>

          <div class="step-actions" style="justify-content: center;">
            <button class="btn btn-primary btn-large" onclick="goToAdmin()">管理画面へ →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbw13mhYCidwyvqC4AKGJ_N-R8ZFt5RZByjQQVdf6sjSgaQnNVhTvUQL3QAfqHfWATgS/exec';
    
    let setupData = {
      tournamentName: '',
      date: '',
      startTime: '13:00',
      endTime: '17:00',
      venue: '',
      address: '',
      teams: [],
      format: 'tournament',
      set12Points: 25,
      set3Points: 15,
      deuceMargin: 2,
      setFormat: '3set',
      notes: ''
    };

    // トップへ戻る
    function goToTop() {
      window.top.location.href = BASE_URL;
    }

    // 管理画面へ
    function goToAdmin() {
      window.top.location.href = BASE_URL + '?page=admin';
    }

    // ローディング表示
    function showLoading() {
      document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
    }

    // ステップ移動
    function goToStep(stepNumber) {
      // 現在のステップのデータを保存
      if (stepNumber === 2) {
        setupData.tournamentName = document.getElementById('tournamentName').value;
        setupData.date = document.getElementById('tournamentDate').value;
        setupData.startTime = document.getElementById('startTime').value;
        setupData.endTime = document.getElementById('endTime').value;
        setupData.venue = document.getElementById('venueName').value;
        setupData.address = document.getElementById('venueAddress').value;
        
        if (!setupData.tournamentName || !setupData.date || !setupData.venue) {
          alert('必須項目を入力してください');
          return;
        }
      } else if (stepNumber === 3) {
        const teamInputs = document.querySelectorAll('.team-input');
        setupData.teams = Array.from(teamInputs).map((input, i) => ({
          id: i + 1,
          name: input.value || `チーム${i + 1}`
        }));
      } else if (stepNumber === 4) {
        const formatRadio = document.querySelector('input[name="matchFormat"]:checked');
        setupData.format = formatRadio ? formatRadio.value : 'tournament';
      }
      
      document.querySelectorAll('.setup-step').forEach(step => {
        step.classList.remove('active');
      });
      
      document.getElementById(`step-${stepNumber}`).classList.add('active');
      updateProgress(stepNumber);
      
      if (stepNumber === 2) {
        generateTeamInputs();
      }
    }

    // プログレスバー更新
    function updateProgress(stepNumber) {
      const progressFill = document.getElementById('progress-fill');
      const percentage = (stepNumber / 4) * 100;
      progressFill.style.width = percentage + '%';
      
      for (let i = 1; i <= 4; i++) {
        const progressStep = document.getElementById(`progress-${i}`);
        if (i <= stepNumber) {
          progressStep.classList.add('active');
        } else {
          progressStep.classList.remove('active');
        }
      }
    }

    // チーム入力欄を生成
    function generateTeamInputs() {
      const teamCount = parseInt(document.getElementById('teamCount').value);
      const container = document.getElementById('team-inputs');
      
      container.innerHTML = '';
      
      for (let i = 0; i < teamCount; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'team-input-wrapper';
        
        const label = document.createElement('label');
        label.className = 'team-input-label';
        label.textContent = `チーム${i + 1}`;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control team-input';
        input.placeholder = `チーム${i + 1}`;
        input.value = setupData.teams[i] ? setupData.teams[i].name : '';
        
        wrapper.appendChild(label);
        wrapper.appendChild(input);
        container.appendChild(wrapper);
      }
    }

    // 確認画面表示
    function showConfirm() {
      setupData.set12Points = parseInt(document.getElementById('set12Points').value);
      setupData.set3Points = parseInt(document.getElementById('set3Points').value);
      setupData.deuceMargin = parseInt(document.getElementById('deuceMargin').value);
      setupData.setFormat = document.getElementById('setFormat').value;
      setupData.notes = document.getElementById('participationNotes').value;
      
      const summary = document.getElementById('confirm-summary');
      
      const formatNames = {
        'league': 'リーグ戦のみ',
        'tournament': 'トーナメントのみ',
        'hybrid': '複合形式（リーグ→トーナメント）'
      };
      
      const setFormatNames = {
        '3set': '3セットマッチ（2セット先取）',
        '2set': '2セットマッチ（1セット先取）',
        '5set': '5セットマッチ（3セット先取）'
      };
      
      summary.innerHTML = `
        <div class="summary-item">
          <span class="summary-label">大会名:</span>
          ${setupData.tournamentName}
        </div>
        <div class="summary-item">
          <span class="summary-label">開催日:</span>
          ${setupData.date} ${setupData.startTime}〜${setupData.endTime}
        </div>
        <div class="summary-item">
          <span class="summary-label">会場:</span>
          ${setupData.venue}
        </div>
        <div class="summary-item">
          <span class="summary-label">チーム数:</span>
          ${setupData.teams.length}チーム
        </div>
        <div class="summary-item">
          <span class="summary-label">試合形式:</span>
          ${formatNames[setupData.format]}
        </div>
        <div class="summary-item">
          <span class="summary-label">セット形式:</span>
          ${setFormatNames[setupData.setFormat]}
        </div>
        <div class="summary-item">
          <span class="summary-label">第1・2セット:</span>
          ${setupData.set12Points}点先取（${setupData.deuceMargin}点差必要）
        </div>
        <div class="summary-item">
          <span class="summary-label">第3セット:</span>
          ${setupData.set3Points}点先取（${setupData.deuceMargin}点差必要）
        </div>
      `;
      
      document.querySelectorAll('.setup-step').forEach(step => {
        step.classList.remove('active');
      });
      
      document.getElementById('step-confirm').classList.add('active');
    }

    // 設定を保存
    function saveSettings() {
      console.log('スプレッドシートに保存します:', setupData);
      
      showLoading();
      document.getElementById('saveBtn').disabled = true;
      
      // Google Apps Script の関数を呼び出し
      google.script.run
        .withSuccessHandler(onSaveSuccess)
        .withFailureHandler(onSaveFailure)
        .saveInitialSetup(setupData);
    }

    // 保存成功時
    function onSaveSuccess(result) {
      hideLoading();
      console.log('✅ 保存成功:', result);
      
      document.querySelectorAll('.setup-step').forEach(step => {
        step.classList.remove('active');
      });
      document.getElementById('step-complete').classList.add('active');
      document.getElementById('progress-fill').style.width = '100%';
    }

    // 保存失敗時
    function onSaveFailure(error) {
      hideLoading();
      document.getElementById('saveBtn').disabled = false;
      console.error('❌ 保存失敗:', error);
      alert('保存に失敗しました: ' + error.message);
    }

    // 初期化
    document.addEventListener('DOMContentLoaded', function() {
      console.log('初期設定画面が読み込まれました');
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('tournamentDate').value = today;
      
      generateTeamInputs();
    });
  </script>
</body>
</html>
