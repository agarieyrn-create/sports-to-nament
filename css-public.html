<style>
/* Tournament Pro - 観客向け画面スタイル */

/* ヘッダー */
.public-header {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
  color: white;
  padding: 2rem;
  box-shadow: var(--shadow-md);
}

.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.header-icon {
  font-size: 3rem;
}

.header-text {
  flex: 1;
}

.tournament-name {
  font-size: 2rem;
  margin: 0;
  font-weight: 700;
}

.tournament-info {
  margin: 0.5rem 0 0;
  opacity: 0.95;
  font-size: 1rem;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.current-time {
  font-size: 2rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
}

.btn-refresh {
  background: rgba(255, 255, 255, 0.2);
  color: white;
  border: 2px solid white;
  padding: 0.5rem 1rem;
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  font-weight: 600;
}

.btn-refresh:hover {
  background: white;
  color: var(--color-primary);
}

.btn-refresh.disabled {
  opacity: 0.5;
}

/* ナビゲーション */
.public-nav {
  background: white;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: center;
  overflow-x: auto;
  position: sticky;
  top: 0;
  z-index: 99;
}

.nav-tab {
  background: none;
  border: none;
  padding: 1rem 2rem;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  color: var(--color-text);
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  white-space: nowrap;
}

.nav-tab:hover {
  background: var(--color-background);
  border-bottom-color: var(--color-primary);
}

.nav-tab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

/* メインコンテンツ */
.public-main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

.view-content {
  display: none;
}

.view-content.active {
  display: block;
}

.section-title {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* LIVE表示 */
.live-section {
  margin-bottom: 3rem;
}

.live-indicator {
  display: inline-block;
  width: 12px;
  height: 12px;
  background: var(--color-danger);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
  box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
}

@keyframes pulse {
  0% {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
  }
  70% {
    opacity: 0.7;
    transform: scale(1.15);
    box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
  }
}

.live-matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
  gap: 1.5rem;
}

/* === LIVEスコアカード（リデザイン） === */
.live-match-card {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: fadeIn 0.5s ease;
  position: relative;
}

/* 上部グロー（進行中の強調） */
.live-match-card::before {
  content: '';
  display: block;
  height: 4px;
  background: linear-gradient(90deg, var(--color-danger), #ff6b6b, var(--color-danger));
  background-size: 200% auto;
  animation: shimmer 2s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.live-match-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.875rem 1.25rem;
  background: var(--color-background);
  border-bottom: 1px solid var(--color-border);
}

.live-badge {
  background: var(--color-danger);
  color: white;
  padding: 0.25rem 0.75rem;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  letter-spacing: 0.03em;
}

.court-label {
  color: var(--color-text-light);
  font-size: 0.875rem;
  font-weight: 500;
}

/* スコアボードエリア */
.live-scoreboard {
  padding: 1.25rem 1.5rem;
}

.live-team-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 0;
}

.live-team-row + .live-team-row {
  border-top: 1px dashed var(--color-border);
}

.live-team-row.winner-row .live-team-name {
  color: var(--color-primary);
}

.live-team-row.winner-row .live-sets-count {
  background: var(--color-primary);
  color: white;
}

.live-team-name {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--color-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.live-team-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* セット獲得数（大きく） */
.live-sets-count {
  min-width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  background: var(--color-border);
  color: var(--color-text-light);
  font-size: 1.4rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

/* 各セットスコア */
.live-set-scores {
  display: flex;
  gap: 0.5rem;
  justify-content: flex-end;
  align-items: center;
}

.set-score-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 38px;
}

.set-num-label {
  font-size: 0.65rem;
  color: var(--color-text-light);
  font-weight: 600;
  margin-bottom: 0.15rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.set-score-val {
  font-size: 1.3rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--color-text);
  background: var(--color-background);
  border-radius: var(--radius-sm);
  padding: 0.15rem 0.4rem;
  min-width: 36px;
  text-align: center;
  line-height: 1.4;
}

.set-score-val.set-winner-val {
  background: var(--color-primary);
  color: white;
}

.set-score-val.set-empty {
  color: var(--color-text-light);
  background: transparent;
  font-size: 1rem;
}

/* 古い live-teams/live-score への互換 */
.live-teams {
  margin-bottom: 0;
}

.live-team {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 0;
}

.live-score {
  font-size: 2.5rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--color-primary);
}

.set-score {
  text-align: center;
}

.set-label {
  font-size: 0.75rem;
  color: var(--color-text-light);
  margin-bottom: 0.25rem;
}

.set-value {
  font-size: 1.25rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
}

/* 自動更新インジケーター */
.refresh-indicator {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.8rem;
  color: var(--color-text-light);
  padding: 0.5rem 1.25rem;
  border-top: 1px solid var(--color-border);
}

.refresh-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-success);
  animation: pulse 2s infinite;
}

/* 次の試合・最近の試合 */
.next-section,
.recent-section {
  margin-bottom: 2.5rem;
}

.matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}

.match-card-public {
  background: white;
  border-radius: var(--radius-md);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  transition: var(--transition);
  border-left: 4px solid var(--color-border);
}

.match-card-public:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.match-time {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--color-text-light);
  font-size: 0.875rem;
  margin-bottom: 0.75rem;
  font-weight: 500;
}

.match-teams-public {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.5rem;
}

.team-name-public {
  font-size: 1.05rem;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.team-name-public:last-child {
  text-align: right;
}

.vs-text {
  color: var(--color-text-light);
  font-size: 0.8rem;
  font-weight: 700;
  text-align: center;
}

/* 完了試合リスト */
.matches-list {
  display: grid;
  gap: 0.75rem;
}

.match-item-public {
  background: white;
  padding: 0.875rem 1.25rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1rem;
  border-left: 3px solid var(--color-success);
}

.match-item-time {
  font-size: 0.8rem;
  color: var(--color-text-light);
  font-weight: 500;
  white-space: nowrap;
}

.match-item-teams {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  overflow: hidden;
}

.match-item-team {
  font-size: 0.95rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.match-item-vs {
  color: var(--color-text-light);
  font-size: 0.75rem;
  flex-shrink: 0;
}

.match-result {
  font-size: 1.1rem;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--color-text);
  white-space: nowrap;
  text-align: right;
}

.match-result-winner {
  color: var(--color-primary);
}

/* スケジュール */
.filter-tabs {
  display: flex;
  gap: 1rem;
  margin-bottom: 2rem;
  overflow-x: auto;
}

.filter-tab {
  background: white;
  border: 2px solid var(--color-border);
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
}

.filter-tab:hover {
  border-color: var(--color-primary);
}

.filter-tab.active {
  background: var(--color-primary);
  color: white;
  border-color: var(--color-primary);
}

#schedule-container {
  display: grid;
  gap: 1rem;
}

/* 順位表 */
.standings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 2rem;
}

.standings-group {
  background: white;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.group-header {
  background: var(--color-primary);
  color: white;
  padding: 1rem 1.5rem;
  font-size: 1.25rem;
  font-weight: 700;
}

.standings-table {
  width: 100%;
  border-collapse: collapse;
}

.standings-table th,
.standings-table td {
  padding: 1rem;
  text-align: center;
}

.standings-table th {
  background: var(--color-background);
  font-weight: 600;
  font-size: 0.875rem;
  color: var(--color-text-light);
}

.standings-table td {
  border-bottom: 1px solid var(--color-border);
}

.standings-table tr:last-child td {
  border-bottom: none;
}

.rank-cell {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--color-primary);
}

.team-cell {
  text-align: left;
  font-weight: 600;
}

.qualified {
  background: rgba(16, 185, 129, 0.1);
}

/* トーナメント */
#tournament-container {
  background: white;
  padding: 2rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  overflow-x: auto;
}

/* 大会情報 */
.info-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 2rem;
  box-shadow: var(--shadow);
  margin-bottom: 2rem;
}

.info-card-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: var(--color-text);
}

.info-table {
  width: 100%;
  border-collapse: collapse;
}

.info-table th,
.info-table td {
  padding: 1rem;
  text-align: left;
  border-bottom: 1px solid var(--color-border);
}

.info-table th {
  font-weight: 600;
  color: var(--color-text-light);
  width: 30%;
}

.info-table tr:last-child th,
.info-table tr:last-child td {
  border-bottom: none;
}

.progress-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2rem;
  margin-bottom: 2rem;
}

.progress-stat {
  text-align: center;
}

.progress-label {
  font-size: 0.875rem;
  color: var(--color-text-light);
  margin-bottom: 0.5rem;
}

.progress-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--color-primary);
  font-family: 'Inter', sans-serif;
}

.progress-bar-container {
  background: var(--color-border);
  height: 20px;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 0.5rem;
}

.progress-bar {
  background: var(--color-primary);
  height: 100%;
  transition: width 1s ease;
}

.progress-percentage {
  text-align: center;
  font-weight: 600;
  color: var(--color-text-light);
}

.info-rules {
  line-height: 1.8;
}

.info-rules p {
  margin-bottom: 0.5rem;
}

/* データなし表示 */
.no-data {
  text-align: center;
  padding: 3rem;
  color: var(--color-text-light);
  background: white;
  border-radius: var(--radius-md);
}

.no-data p {
  font-size: 1.1rem;
}

/* フッター */
.public-footer {
  background: #1e293b;
  color: white;
  padding: 2rem;
  text-align: center;
  margin-top: 4rem;
}

.public-footer p {
  margin: 0.5rem 0;
  opacity: 0.8;
}

.last-updated {
  font-size: 0.875rem;
}

/* レスポンシブ */
@media (max-width: 768px) {
  .public-header {
    padding: 1rem;
  }

  .header-content {
    gap: 0.75rem;
  }

  .tournament-name {
    font-size: 1.25rem;
  }

  .header-icon {
    font-size: 1.75rem;
  }

  .current-time {
    font-size: 1.4rem;
  }

  .public-main {
    padding: 1rem;
  }

  .live-matches-grid,
  .matches-grid,
  .standings-grid {
    grid-template-columns: 1fr;
  }

  .progress-stats {
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .nav-tab {
    padding: 0.875rem 1rem;
    font-size: 0.875rem;
  }

  .live-team-name {
    font-size: 1.1rem;
  }

  .live-sets-count {
    min-width: 2.2rem;
    height: 2.2rem;
    font-size: 1.2rem;
  }

  .set-score-val {
    font-size: 1.1rem;
    min-width: 30px;
  }

  .section-title {
    font-size: 1.4rem;
  }
}

@media (max-width: 480px) {
  .public-header {
    padding: 0.875rem;
  }

  .tournament-name {
    font-size: 1.1rem;
  }

  .current-time {
    font-size: 1.2rem;
  }

  .live-set-scores {
    gap: 0.35rem;
  }

  .set-score-item {
    min-width: 30px;
  }

  .match-item-public {
    grid-template-columns: 1fr;
    gap: 0.25rem;
  }

  .progress-stats {
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
}
</style>
