    } else {
      // 設定から初期値を設定

    }
  });

}

/**
 * 設定からフォームに初期値を設定
 */
function populateDocumentFormFromSettings() {
  const settings = globalData.settings;
  
  // 基本設定から自動入力できる項目のみ設定
  // その他は空欄のまま
}

/**
 * データからフォームに値を設定
 */
function populateDocumentForm(data) {
  Object.keys(data).forEach(function(key) {
    const element = document.getElementById('doc-' + key);
    if (element && data[key]) {
      element.value = data[key];
    }
  });
  
  // カスタムフィールドを復元
  if (data.customFields && Array.isArray(data.customFields)) {
    data.customFields.forEach(function(field) {
      addCustomField(field.title, field.content);
    });
  }
}

/**
 * カスタムフィールド追加
 */
function addCustomField(title = '', content = '') {
  customFieldsCount++;
  const container = document.getElementById('custom-fields-container');
  
  const fieldHtml = `
    <div class="custom-field-item" id="custom-field-${customFieldsCount}">
      <div class="custom-field-inputs">
        <input type="text" class="form-control custom-field-title" placeholder="項目名（例: 表彰式での注意事項）" value="${escapeHtml(title)}">
        <textarea class="form-control custom-field-content" rows="2" placeholder="内容を入力">${escapeHtml(content)}</textarea>
      </div>
      <button type="button" class="custom-field-remove" onclick="removeCustomField(${customFieldsCount})">×</button>
    </div>
  `;
  
  container.insertAdjacentHTML('beforeend', fieldHtml);
}

/**
 * カスタムフィールド削除
 */
function removeCustomField(id) {
  const field = document.getElementById('custom-field-' + id);
  if (field) {
    field.remove();
  }
}

/**
 * 大会要項データを保存
 */
function saveDocumentData() {
  const document = {
    organizer: document.getElementById('doc-organizer').value,
    coOrganizer: document.getElementById('doc-coOrganizer').value,
    receptionTime: document.getElementById('doc-receptionTime').value,
    openingCeremonyTime: document.getElementById('doc-openingCeremonyTime').value,
    closingCeremonyTime: document.getElementById('doc-closingCeremonyTime').value,
    venuePostalCode: document.getElementById('doc-venuePostalCode').value,
    venueAccess: document.getElementById('doc-venueAccess').value,
    sportType: document.getElementById('doc-sportType').value,
    eligibility: document.getElementById('doc-eligibility').value,
    teamSize: document.getElementById('doc-teamSize').value,
    entryFee: document.getElementById('doc-entryFee').value,
    awards: document.getElementById('doc-awards').value,
    dress: document.getElementById('doc-dress').value,
    bringItems: document.getElementById('doc-bringItems').value,
    prohibitions: document.getElementById('doc-prohibitions').value,
    insurance: document.getElementById('doc-insurance').value,
    otherNotes: document.getElementById('doc-otherNotes').value,
    applicationDeadline: document.getElementById('doc-applicationDeadline').value,
    applicationMethod: document.getElementById('doc-applicationMethod').value,
    contactPerson: document.getElementById('doc-contactPerson').value,
    contactPhone: document.getElementById('doc-contactPhone').value,
    contactEmail: document.getElementById('doc-contactEmail').value,
    customFields: []
  };
  
  // カスタムフィールドを収集
  document.querySelectorAll('.custom-field-item').forEach(function(item) {
    const title = item.querySelector('.custom-field-title').value;
    const content = item.querySelector('.custom-field-content').value;
    if (title || content) {
      document.customFields.push({ title: title, content: content });
    }
  });
  
  showLoading(true);
  saveTournamentDocumentToServer(document, function(success) {
    showLoading(false);
  });
}

/**
 * プレビュー表示
 */
function previewDocument() {
  // PDF出力画面を新しいウィンドウで開く
  const previewWindow = window.open('', '大会要項プレビュー', 'width=800,height=1000');
  
  const settings = globalData.settings;
  const html = generateDocumentHTML(settings);
  
  previewWindow.document.write(html);
  previewWindow.document.close();
}
