<script>
/**
 * Tournament Pro - スコア入力機能
 */

let currentMatchForScore = null;

/**
 * スコア入力画面を開く
 */
function openScoreInput(matchId) {
  debugLog('スコア入力を開く:', matchId);
  
  const match = globalData.matches.find(m => m.matchId === matchId);
  if (!match) {
    showError('試合が見つかりません');
    return;
  }
  
  currentMatchForScore = match;
  
  const teamA = getTeamNameById(match.teamA);
  const teamB = getTeamNameById(match.teamB);
  
  const modal = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="max-width: 600px;">
        <div class="modal-header">
          <h3 class="modal-title">スコア入力 - ${escapeHtml(matchId)}</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div style="margin-bottom: 2rem;">
            <h4>${escapeHtml(teamA)} vs ${escapeHtml(teamB)}</h4>
            <p>コート${escapeHtml(match.court)} | ${formatTime(match.startTime)}</p>
          </div>
          
          <div class="score-input-grid">
            <div class="score-team">
              <h5>${escapeHtml(teamA)}</h5>
              <div class="score-sets">
                <div class="score-set">
                  <label>第1セット</label>
                  <input type="number" id="scoreA-S1" class="form-control" min="0" max="50" value="${match.scoreA_S1 || 0}">
                </div>
                <div class="score-set">
                  <label>第2セット</label>
                  <input type="number" id="scoreA-S2" class="form-control" min="0" max="50" value="${match.scoreA_S2 || 0}">
                </div>
                <div class="score-set">
                  <label>第3セット</label>
                  <input type="number" id="scoreA-S3" class="form-control" min="0" max="50" value="${match.scoreA_S3 || ''}">
                </div>
              </div>
            </div>
            
            <div class="score-team">
              <h5>${escapeHtml(teamB)}</h5>
              <div class="score-sets">
                <div class="score-set">
                  <label>第1セット</label>
                  <input type="number" id="scoreB-S1" class="form-control" min="0" max="50" value="${match.scoreB_S1 || 0}">
                </div>
                <div class="score-set">
                  <label>第2セット</label>
                  <input type="number" id="scoreB-S2" class="form-control" min="0" max="50" value="${match.scoreB_S2 || 0}">
                </div>
                <div class="score-set">
                  <label>第3セット</label>
                  <input type="number" id="scoreB-S3" class="form-control" min="0" max="50" value="${match.scoreB_S3 || ''}">
                </div>
              </div>
            </div>
          </div>
          
          <div class="form-group" style="margin-top: 2rem;">
            <label class="form-label">試合状態</label>
            <select id="match-status" class="form-control">
              <option value="未開始" ${match.status === '未開始' ? 'selected' : ''}>未開始</option>
              <option value="進行中" ${match.status === '進行中' ? 'selected' : ''}>進行中</option>
              <option value="完了" ${match.status === '完了' ? 'selected' : ''}>完了</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="closeModal()" class="btn btn-secondary">キャンセル</button>
          <button onclick="submitScore()" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('modal-container').innerHTML = modal;
  
  // CSSを追加
  const style = document.createElement('style');
  style.textContent = `
    .score-input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    .score-team h5 {
      margin-bottom: 1rem;
      text-align: center;
    }
    .score-sets {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .score-set {
      display: flex;
      flex-direction: column;
    }
    .score-set label {
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }
    .score-set input {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .score-input-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
  `;
  document.head.appendChild(style);
}

/**
 * スコアを送信
 */
function submitScore() {
  if (!currentMatchForScore) return;
  
  const scores = {
    scoreA_S1: parseInt(document.getElementById('scoreA-S1').value) || 0,
    scoreB_S1: parseInt(document.getElementById('scoreB-S1').value) || 0,
    scoreA_S2: parseInt(document.getElementById('scoreA-S2').value) || 0,
    scoreB_S2: parseInt(document.getElementById('scoreB-S2').value) || 0,
    scoreA_S3: parseInt(document.getElementById('scoreA-S3').value) || null,
    scoreB_S3: parseInt(document.getElementById('scoreB-S3').value) || null,
    status: document.getElementById('match-status').value
  };
  
  // 第3セットが空の場合はnullに
  if (!scores.scoreA_S3 && !scores.scoreB_S3) {
    scores.scoreA_S3 = null;
    scores.scoreB_S3 = null;
  }
  
  showLoading(true);
  updateMatchScoreOnServer(currentMatchForScore.matchId, scores, function(success) {
    showLoading(false);
    if (success) {
      closeModal();
      currentMatchForScore = null;
      refreshData();
    }
  });
}
</script>
