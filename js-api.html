/**
 * すべてのデータを読み込み
 */
function loadAllData(callback) {
  debugLog('すべてのデータを読み込み中...');
  
  google.script.run
    .withSuccessHandler(function(response) {
      debugLog('データ読み込み成功', response);
      
      if (response.settings && response.settings.success) {
        globalData.settings = response.settings.data;
      }
      if (response.teams && response.teams.success) {
        globalData.teams = response.teams.data;
      }
      if (response.matches && response.matches.success) {
        globalData.matches = response.matches.data;
      }
      if (response.standings && response.standings.success) {
        globalData.standings = response.standings.data;
      }
      if (response.tournament && response.tournament.success) {
        globalData.tournament = response.tournament.data;
      }
      if (response.tasks && response.tasks.success) {
        globalData.tasks = response.tasks.data;
      }
      
      if (callback) callback(true);
    })
    .withFailureHandler(function(error) {
      errorLog('データ読み込みエラー', error);
      showError('データの読み込みに失敗しました');
      if (callback) callback(false);
    })
    .getAllData();
}
